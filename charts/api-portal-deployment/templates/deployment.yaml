apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-portal-deployment.fullname" . }}
  labels:
{{ include "api-portal-deployment.labels" . | indent 4 }}
    mcl.sh/name: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "api-portal-deployment.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      mcl.sh/name: {{ .Chart.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{ toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "api-portal-deployment.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        mcl.sh/name: {{ .Chart.Name }}
    spec:
    {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ include "api-portal-deployment.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
          {{- range .Values.extraArgs }}
            - {{ . | quote }}
          {{- end }}
          {{- range .Values.args }}
            - {{ . | quote }}
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 14 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 14 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metric
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: files
              mountPath: /mnt/files
          {{- with .Values.config }}
            - name: config
              mountPath: /etc/nx
              readOnly: true
          {{- end }}
          {{- range .Values.secrets }}
            - name: {{ .name | quote }}
              mountPath: {{ .mountPath | quote }}
              readOnly: {{ .readOnly | default true }}
          {{- end }}
          {{- range .Values.configMaps }}
            - name: {{ .name | quote }}
              mountPath: {{ .mountPath | quote }}
              readOnly: {{ .readOnly | default true }}
          {{- end }}
          {{- range .Values.csiSecrets }}
            - name: {{ .name | quote }}
              mountPath: {{ .mountPath | quote }}
              readOnly: true
          {{- end }}
    {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- tpl . $ | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      volumes:
      {{- with .Values.config }}
        - name: config
          configMap:
            name: {{ include "api-portal-deployment.fullname" $ }}
      {{- end }}
        - name: files
        {{- if .Values.volume.data.volumeClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.volume.data.volumeClaim }}
        {{- end }}
        {{- range .Values.secrets }}
        - name: {{ .name | quote }}
          secret:
            secretName: {{ .secretName | quote }}
            optional: {{ .optional | default false }}
        {{- end }}
        {{- range .Values.configMaps }}
        - name: {{ .name | quote }}
          configMap:
            name: {{ .configMapName | quote }}
            optional: {{ .optional | default false }}
        {{- end }}
        {{- range .Values.csiSecrets }}
        - name: {{ .name | quote }}
          csi:
            driver: {{ .driver | default "secrets-store-gke.csi.k8s.io" }}
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .secretProviderClass | quote }}
        {{- end }}
  {{- with .Values.additionalSpecs }}
    {{ toYaml . | nindent 2 }}
  {{- end }}
