# Default values for default.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  annotations: {}
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Request-driven scale-to-zero via the KEDA HTTP add-on. Needs Traefik
# providers.kubernetesCRD.allowCrossNamespace=true; disable `ingress` when enabling.
scaleToZero:
  enabled: false
  hosts: []                 # e.g. [chart-example.local]
  # Traffic this service claims on the host — set ONE (or neither = whole-host catch-all):
  pathPrefixes: []          # PathPrefix matchers (prefix), e.g. [/api]
  paths: []                 # Path matchers (exact; Traefik v2 {name:regex} groups allowed), e.g. [/assets/{rest:.*}, /dynamic/erp/items]
  stripPrefix: false        # strip the matched pathPrefixes before the interceptor (apps serving at root); needs pathPrefixes
  tag: false                # tag the request so the shared interceptor can route it when the path can't (strip, or overlapping/complex match)
  entryPoint: websecure
  # Without the provider's ingressClass annotation Traefik silently skips the IngressRoute.
  annotations: {}           # e.g. {kubernetes.io/ingress.class: traefik}
  interceptor:
    name: ""                # e.g. keda-add-ons-http-interceptor-proxy
    namespace: ""
    port: 8080
  minReplicas: 0
  maxReplicas: 1
  scaledownPeriod: 300
  targetConcurrency: 10

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Arbitrary objects rendered verbatim alongside the release, e.g. Traefik
# IngressRoute/Middleware CRDs the built-in templates do not cover. Each entry
# may be a structured map or a raw YAML string block, and is run through `tpl`,
# so values may reference .Release/.Values. Because entries are templated, treat
# this as deploy-time trusted input only — do not source it from untrusted callers.
extraObjects: []
