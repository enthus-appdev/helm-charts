# Default values for api-subscription.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: ghcr.io/enthus-appdev/negsoft-api/job
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Optional KSA declaration/creation only: this does NOT select generated worker
# identity. The operator's global jobServiceAccountName template selects it.
# If declared here, keep this name consistent with that explicit non-default KSA.
serviceAccount:
  create: false
  name: ""
  annotations: {}

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

affinity: {}

nodeSelector: {}

tolerations: []

args: []

config: {}

# Credential files rendered into the Secret <fullname>-credentials instead of the ConfigMap.
# Mount it through `secrets` and point the matching <KEY>_FILE env var at each file.
# Administrator stages true while old credentials are STILL rendered, then
# verifies keep in the stored release manifest before a later omission upgrade.
# Live-only annotations or setting true alongside credentials:{} do not stage it.
# Administrator retires the orphan only after no worker/template references it.
credentialsKeep: false
credentials: {}
  # session-jwtsecret: "ref+gcpsecrets://project/secret-name"

env: []
  # - name: MY_STATIC_VAR
  #   value: "my_value"
  # - name: MY_CONFIG_VAR
  #   valueFrom:
  #     configMapKeyRef:
  #       name: my-configmap
  #       key: config-key
  #       optional: false
  # - name: MY_SECRET_VAR
  #   valueFrom:
  #     secretKeyRef:
  #       name: my-secret
  #       key: secret-key
  #       optional: false

envFrom: []
  # - configMapRef:
  #     name: my-configmap
  #     optional: false
  # - secretRef:
  #     name: my-secret
  #     optional: false

secrets: []
  # - name: cert-secret
  #   secretName: my-certificate-secret
  #   mountPath: /etc/certs
  #   readOnly: true
  #   optional: false

# Per-subscription read-only files. This chart normally owns the namespace SPC;
# use create:false only to reference an SPC with one other existing Helm owner.
# No Kubernetes Secret sync. Requires the updated CRD and CSI-capable operator;
# administrator installs schema before application values introduce this field.
# Generated workers must use the operator template\'s explicit non-default KSA.
csiSecrets: []
  # - name: job-credentials
  #   mountPath: /var/run/job-secrets
  #   secretProviderClass: subscription-runtime
  #   provider: gke
  #   secrets:
  #     - resourceName: projects/project/secrets/name/versions/latest
  #       path: mssql-password

configMaps: []
  # - name: app-config
  #   configMapName: my-app-config
  #   mountPath: /etc/config
  #   readOnly: true
  #   optional: false

volume:
  data:
    volumeClaim: ""