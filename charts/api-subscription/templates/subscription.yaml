apiVersion: enthus.de/v1
kind: NegSoftSubscription
metadata:
  name: {{ include "api-subscription.fullname" . }}
spec:
  imageRepository: {{.Values.image.repository | quote}}
  imageTag: {{.Values.image.tag | quote}}
  configMapName: {{ include "api-subscription.fullname" . }}
  persistentVolumeClaimName: {{.Values.volume.data.volumeClaim | quote}}
  {{- with .Values.args }}
  preCommands:
    {{ toYaml . | nindent 4}}
  {{- end }}
  {{- with .Values.resources }}
  resources:
    {{ toYaml . | nindent 4}}
  {{- end }}
  {{- with .Values.affinity }}
  affinity:
    {{ toYaml . | nindent 4}}
  {{- end }}
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{ toYaml . | nindent 4}}
  {{- end }}
  {{- with .Values.tolerations }}
  tolerations:
    {{ toYaml . | nindent 4}}
  {{- end }}
  {{- with .Values.env }}
  env:
    {{ toYaml . | nindent 4}}
  {{- end }}
  {{- with .Values.envFrom }}
  envFrom:
    {{ toYaml . | nindent 4}}
  {{- end }}
  {{- with .Values.secrets }}
  secrets:
    {{ toYaml . | nindent 4}}
  {{- end }}
  {{- with .Values.csiSecrets }}
  csiSecrets:
    {{- range . }}
    - name: {{ required "csiSecrets.name is required" .name | quote }}
      mountPath: {{ required "csiSecrets.mountPath is required" .mountPath | quote }}
      secretProviderClass: {{ required "csiSecrets.secretProviderClass is required" .secretProviderClass | quote }}
      {{- with .driver }}
      driver: {{ . | quote }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- with .Values.configMaps }}
  configMaps:
    {{ toYaml . | nindent 4}}
  {{- end }}
