{{- $ownedNames := dict }}
{{- range $.Values.csiSecrets }}
{{- if and (hasKey . "create") (not (kindIs "bool" .create)) }}
{{- fail "csiSecrets.create must be a boolean" }}
{{- end }}
{{- if and .secretProviderClass (or (not (hasKey . "create")) .create) }}
{{- if or (and (hasKey . "driver") (not (kindIs "string" .driver))) (ne (.driver | default "secrets-store-gke.csi.k8s.io") "secrets-store-gke.csi.k8s.io") }}
{{- fail "chart-owned SPC requires the GKE driver; use create:false for other drivers" }}
{{- end }}
{{- if or (and (hasKey . "provider") (not (kindIs "string" .provider))) (ne (.provider | default "gke") "gke") }}
{{- fail "chart-owned SPC requires provider:gke; use create:false for other providers" }}
{{- end }}
{{- if or (not (kindIs "slice" .secrets)) (not .secrets) }}
{{- fail "csiSecrets.secrets must be a non-empty list for chart-owned SPC" }}
{{- end }}
{{- range .secrets }}
{{- if not (kindIs "map" .) }}
{{- fail "csiSecrets.secrets entries must contain resourceName and path strings" }}
{{- end }}
{{- if or (not (kindIs "string" .resourceName)) (not .resourceName) (not (kindIs "string" .path)) (not .path) }}
{{- fail "csiSecrets.secrets entries must contain resourceName and path strings" }}
{{- end }}
{{- end }}
{{- $name := toString .secretProviderClass }}
{{- if hasKey $ownedNames $name }}
{{- fail "each chart-owned secretProviderClass must be unique" }}
{{- end }}
{{- $_ := set $ownedNames $name true }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .secretProviderClass | quote }}
  labels:
    {{- include "api-subscription.labels" $ | nindent 4 }}
spec:
  provider: {{ .provider | default "gke" | quote }}
  parameters:
    secrets: |
      {{- range .secrets }}
      - resourceName: {{ .resourceName | quote }}
        path: {{ .path | quote }}
      {{- end }}
{{- end }}
{{- end }}
