{{- if not (kindIs "bool" .Values.credentialsKeep) }}
{{- fail "credentialsKeep must be a boolean" }}
{{- end }}
{{- with .Values.credentials }}
apiVersion: v1
kind: Secret
metadata:
  {{- if $.Values.credentialsKeep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  name: {{ include "api-subscription.fullname" $ }}-credentials
  labels:
    {{- include "api-subscription.labels" $ | nindent 4 }}
type: Opaque
# stringData, not data | b64enc: the deploy resolves ref+ values in the rendered manifest
# (helm secrets --evaluate-templates), which cannot see refs inside base64.
stringData:
  {{- range $file, $value := . }}
  {{ $file }}: {{ $value | quote }}
  {{- end }}
{{- end }}
