{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  {{- if .Values.rbac.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "negsoft-operator.labels" . | nindent 4 }}
  name: {{ include "negsoft-operator.fullname" . }}-update-cronjobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "negsoft-operator.fullname" . }}-update-cronjobs
subjects:
  - kind: ServiceAccount
    name: {{ include "negsoft-operator.serviceAccountName" . | quote }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  {{- if .Values.rbac.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "negsoft-operator.labels" . | nindent 4 }}
  name: {{ include "negsoft-operator.fullname" . }}-read-subscriptions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "negsoft-operator.fullname" . }}-read-subscriptions
subjects:
  - kind: ServiceAccount
    name: {{ include "negsoft-operator.serviceAccountName" . | quote }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
