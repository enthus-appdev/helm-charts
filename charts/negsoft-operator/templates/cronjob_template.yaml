{{- define "negsoft-operator.cronjob_template" -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "negsoft-operator.fullname" . }}
  labels:
    {{- include "negsoft-operator.labels" . | nindent 4 }}
spec:
  schedule: ""
  timeZone: "Europe/Berlin"
  concurrencyPolicy: "Forbid"
  jobTemplate:
    spec:
      template:
        metadata:
          {{- if or .Values.podAnnotations .Values.signatureVolume.enabled }}
          annotations:
            {{- with .Values.podAnnotations }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.signatureVolume.enabled }}
            gke-gcsfuse/volumes: "true"
            {{- end }}
          {{- end }}
          labels:
            {{- include "negsoft-operator.labels" . | nindent 12 }}
            {{- with .Values.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          {{- if .Values.signatureVolume.enabled }}
          serviceAccountName: {{ required "jobServiceAccountName is required for mounted subscription jobs" .Values.jobServiceAccountName | quote }}
          {{- else if .Values.jobServiceAccountName }}
          serviceAccountName: {{ .Values.jobServiceAccountName | quote }}
          {{- end }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: cronjob
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              image: "" # is overridden by operator
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              volumeMounts:
              {{- if .Values.signatureVolume.enabled }}
                - name: signatures
                  mountPath: {{ .Values.signatureVolume.mountPath | quote }}
                  readOnly: true
              {{- end }}
                - name: config
                  mountPath: /etc/nx
                  readOnly: true
                - name: files
                  mountPath: /mnt/files
          volumes:
          {{- if .Values.signatureVolume.enabled }}
            - name: signatures
              csi:
                driver: gcsfuse.csi.storage.gke.io
                readOnly: true
                volumeAttributes:
                  bucketName: {{ required "signatureVolume.bucketName is required when enabled" .Values.signatureVolume.bucketName | quote }}
                  mountOptions: {{ .Values.signatureVolume.mountOptions | quote }}
          {{- end }}
            - name: config
              configMap:
                name: "" # is overridden by operator
            - name: files
              emptyDir: {} # is overridden by operator
          restartPolicy: OnFailure
{{- end }}
