{{- if and (hasKey .Values.secret "create") (not (kindIs "bool" .Values.secret.create)) }}
{{- fail "secret.create must be a boolean" }}
{{- end }}
{{- if and (hasKey .Values.secret "keep") (not (kindIs "bool" .Values.secret.keep)) }}
{{- fail "secret.keep must be a boolean" }}
{{- end }}
{{- if or (not (hasKey .Values.secret "create")) .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  {{- if .Values.secret.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  name: {{ include "negsoft-operator.fullname" . }}-secret
  labels:
    {{- include "negsoft-operator.labels" . | nindent 4 }}
type: Opaque
data:
  mssqlHostname: {{ .Values.secret.mssqlHostname | b64enc | quote }}
  mssqlPort: {{ .Values.secret.mssqlPort | b64enc | quote }}
  {{- if .Values.secret.mssqlDatabase }}
  mssqlDatabase: {{ .Values.secret.mssqlDatabase | b64enc | quote }}
  {{- end }}
  mssqlUsername: {{ .Values.secret.mssqlUsername | b64enc | quote }}
  mssqlPassword: {{ .Values.secret.mssqlPassword | b64enc | quote }}
  redisAddresses: {{ .Values.secret.redisAddresses | b64enc | quote }}
  redisMasterSet: {{ .Values.secret.redisMasterSet | b64enc | quote }}
  redisDatabase: {{ .Values.secret.redisDatabase | b64enc | quote }}
  redisPassword: {{ .Values.secret.redisPassword | default "" | b64enc | quote }}
{{- end }}
