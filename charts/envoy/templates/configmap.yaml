apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "envoy.fullname" . }}
  labels:
    {{- include "envoy.labels" . | nindent 4 }}
data:
  # Debug mode
  DEBUG: {{ .Values.config.debug | quote }}

  # Jira configuration
  {{- with .Values.config.jira }}
  JIRA_BASE_URL: {{ .baseUrl | quote }}
  JIRA_API_TOKEN: {{ .apiToken | quote }}
  JIRA_USER_EMAIL: {{ .userEmail | quote }}
  JIRA_PROJECT_KEY: {{ .projectKey | quote }}
  {{- end }}

  # GitHub configuration
  {{- with .Values.config.github }}
  GITHUB_TOKEN: {{ .token | quote }}
  {{- end }}

  # Notifications configuration
  {{- with .Values.config.notifications }}
  DISCORD_WEBHOOK_URL: {{ .discordWebhookUrl | quote }}
  {{- end }}

  # Git configuration
  {{- with .Values.config.git }}
  WORKTREE_BASE_PATH: {{ .worktreeBasePath | quote }}
  {{- end }}

  # Claude configuration
  {{- with .Values.config.claude }}
  CLAUDE_CODE_PATH: {{ .path | quote }}
  MAX_CONCURRENT_TASKS: {{ .maxConcurrent | quote }}
  {{- end }}

  # Repositories configuration (cloud deployment)
  {{- if .Values.config.repositories }}
  ENVOY_REPOSITORIES: {{ .Values.config.repositories | toJson | quote }}
  {{- end }}
