# Default values for envoy
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: ghcr.io/enthus-appdev/envoy
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: envoy.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: envoy-tls
  #    hosts:
  #      - envoy.local

resources: {}
  # requests:
  #   cpu: 10m
  #   memory: 64Mi
  # limits:
  #   cpu: 200m
  #   memory: 256Mi

# Persistent storage for SQLite database
persistence:
  enabled: false
  annotations: {}
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: ""
  # existingClaim: ""

# Health checks
livenessProbe:
  enabled: true
  path: /api/health
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /api/health
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Application configuration
# These values are mounted as a ConfigMap
config:
  debug: false
  jira:
    baseUrl: ""
    apiToken: ""
    userEmail: ""
    projectKey: ""
  github:
    token: ""
  notifications:
    discordWebhookUrl: ""
  git:
    worktreeBasePath: /data/worktrees
  claude:
    path: claude
    maxConcurrent: 3
  # Cloud repository configuration
  # Repositories are auto-cloned on first deployment
  # Example:
  # repositories:
  #   - name: "my-repo"
  #     url: "github.com/owner/repo"
  #     isDefault: true
  #     description: "Main repository"
  #     color: "#3B82F6"
  repositories: []
