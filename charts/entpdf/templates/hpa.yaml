{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "entpdf.fullname" . }}
  labels:
    {{- include "entpdf.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "entpdf.fullname" . }}
  {{- toYaml .Values.autoscaling.config | nindent 2 }}
{{- end }}
