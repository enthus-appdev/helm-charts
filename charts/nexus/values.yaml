# Default values for nexus.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: registry.gitlab.com/mcldev/negsoft/nexus
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  annotations: {}
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Application configuration. The container reads a `config.json` file
# mounted at `config.mountPath`. Pick exactly one provider:
#
#   provider: ""                     -> nothing is mounted; the caller
#                                       wires the file through some other
#                                       volume in `.Values.volumes`.
#   provider: "configMap"            -> the chart renders a ConfigMap
#                                       from `config.configMap.values`.
#   provider: "secretProviderClass"  -> the chart mounts a CSI volume
#                                       backed by a Secret Store CSI
#                                       SecretProviderClass. Set
#                                       `secretProviderClass.create: true`
#                                       to also render the SPC resource.
config:
  provider: ""
  mountPath: /config

  configMap:
    values: {}

  secretProviderClass:
    name: ""
    create: false
    provider: gke
    driver: secrets-store-gke.csi.k8s.io
    # Forwarded to `parameters.secrets` when `create: true`. To preserve
    # the legacy ConfigMap shape, expose a single file named
    # `config.json`:
    #   secrets:
    #     - resourceName: "projects/<project>/secrets/<secret>/versions/latest"
    #       path: "config.json"
    secrets: []