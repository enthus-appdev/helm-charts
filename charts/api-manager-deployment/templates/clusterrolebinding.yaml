{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  {{- if .Values.rbac.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "api-manager-deployment.selectorLabels" . | nindent 4 }}
  name: {{ template "api-manager-deployment.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "api-manager-deployment.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "api-manager-deployment.serviceAccountName" . | quote }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
