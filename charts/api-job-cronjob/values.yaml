# Default values for cron.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: ghcr.io/enthus-appdev/negsoft-api/job
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []
#    - name: pull-secret

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

nameOverride: ""
fullnameOverride: ""

extraArgs: []
podAnnotations: {}

cronjobs: []
#  - name: "test"
#    schedule: "0 0 0 0 0"
#    timeZone: ""
#    resources: {}
#      # We usually recommend not to specify default resources and to leave this as a conscious
#      # choice for the user. This also increases chances charts run on environments with little
#      # resources, such as Minikube. If you do want to specify resources, uncomment the following
#      # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
#      # limits:
#      #  cpu: 100m
#      #  memory: 128Mi
#      # requests:
#      #  cpu: 100m
#      #  memory: 128Mi
#    nodeSelector: {}
#    tolerations: []
#    affinity: {}
#    startingDeadlineSeconds: 0
#    # Pod restarts before the Job counts as failed (Kubernetes default: 6 when unset).
#    # 0 runs the job exactly once per schedule; use it for jobs that already report
#    # per-item failures themselves and would only repeat the reports on a restart.
#    backoffLimit: 0

# startingDeadlineSeconds: 0
# backoffLimit: 6
timeZone: ""

volume:
  data:
    volumeClaim: ""

