apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-deployment.fullname" . }}
  labels:
    {{- include "api-deployment.labels" . | nindent 4 }}
spec:
  {{- if not (or .Values.autoscaling.enabled .Values.scaleToZero.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: {{ .Values.podStrategyType }}
  selector:
    matchLabels:
      {{- include "api-deployment.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.signatureVolume.enabled }}
        gke-gcsfuse/volumes: "true"
        {{- with .Values.signatureVolume.sidecarAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "api-deployment.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "api-deployment.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.args }}
          args:
          {{- range . }}
            - {{ . | quote }}
          {{- end }}
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 14 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 14 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- if .Values.grpcProbes.enabled }}
          {{- if or .Values.livenessProbe.enabled .Values.readinessProbe.enabled }}
          {{- fail "grpcProbes.enabled replaces the HTTP probes: set livenessProbe.enabled and readinessProbe.enabled to false" }}
          {{- end }}
            - name: grpc-health
              containerPort: {{ .Values.grpcProbes.port }}
              protocol: TCP
          livenessProbe:
            grpc:
              port: {{ .Values.grpcProbes.port }}
              {{- with .Values.grpcProbes.service }}
              service: {{ . | quote }}
              {{- end }}
            {{- with .Values.grpcProbes.liveness }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            grpc:
              port: {{ .Values.grpcProbes.port }}
              {{- with .Values.grpcProbes.service }}
              service: {{ . | quote }}
              {{- end }}
            {{- with .Values.grpcProbes.readiness }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /
              port: http
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /
              port: http
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
          {{- with .Values.config }}
            - name: config
              mountPath: /etc/nx
              readOnly: true
          {{- end }}
            - name: files
              mountPath: /mnt/files
          {{- if .Values.signatureVolume.enabled }}
            - name: signatures
              mountPath: {{ .Values.signatureVolume.mountPath | quote }}
              readOnly: true
          {{- end }}
          {{- range .Values.secrets }}
            - name: {{ .name | quote }}
              mountPath: {{ .mountPath | quote }}
              readOnly: {{ .readOnly | default true }} # Enforce read-only by default to enhance security
          {{- end }}
          {{- range .Values.configMaps }}
            - name: {{ .name | quote }}
              mountPath: {{ .mountPath | quote }}
              readOnly: {{ .readOnly | default true }} # Enforce read-only by default to enhance security
          {{- end }}
          {{- range .Values.csiSecrets }}
            - name: {{ .name | quote }}
              mountPath: {{ .mountPath | quote }}
              readOnly: true
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if .Values.signatureVolume.enabled }}
        - name: signatures
          csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: true
            volumeAttributes:
              bucketName: {{ required "signatureVolume.bucketName is required when enabled" .Values.signatureVolume.bucketName | quote }}
              mountOptions: {{ .Values.signatureVolume.mountOptions | quote }}
        {{- end }}
        {{- with .Values.config }}
        - name: config
          configMap:
            name: {{ include "api-deployment.fullname" $ }}
        {{- end }}
        - name: files
        {{- with .Values.volume.data.volumeClaim }}
          persistentVolumeClaim:
            claimName: {{ . }}
        {{- else }}
          emptyDir: {}
        {{- end }}
        {{- range .Values.secrets }}
        - name: {{ .name | quote }}
          secret:
            secretName: {{ .secretName | quote }}
            optional: {{ .optional | default false }} # Ensure configmap is present by default
        {{- end }}
        {{- range .Values.configMaps }}
        - name: {{ .name | quote }}
          configMap:
            name: {{ .configMapName | quote }}
            optional: {{ .optional | default false }} # Ensure configmap is present by default
        {{- end }}
        {{- range .Values.csiSecrets }}
        - name: {{ .name | quote }}
          csi:
            driver: {{ .driver | default "secrets-store-gke.csi.k8s.io" }}
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .secretProviderClass | quote }}
        {{- end }}
