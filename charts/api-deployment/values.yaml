# Default values for deployment.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/enthus-appdev/negsoft-api/http
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podStrategyType: RollingUpdate

podDisruptionBudget:
  enabled: false

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  annotations: {}
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  config:
    minReplicas: 1
    maxReplicas: 10
#    metrics:
#      - type: Resource
#        resource:
#          name: cpu
#          target:
#            type: Utilization
#            averageUtilization: 80

nodeSelector: {}

tolerations: []

affinity: {}

args: []

config: {}

env: []
  # - name: MY_STATIC_VAR
  #   value: "my_value"
  # - name: MY_CONFIG_VAR
  #   valueFrom:
  #     configMapKeyRef:
  #       name: my-configmap
  #       key: config-key
  #       optional: false
  # - name: MY_SECRET_VAR
  #   valueFrom:
  #     secretKeyRef:
  #       name: my-secret
  #       key: secret-key
  #       optional: false

envFrom: []
  # - configMapRef:
  #     name: my-configmap
  #     optional: false
  # - secretRef:
  #     name: my-secret
  #     optional: false

secrets: []
  # - name: cert-secret
  #   secretName: my-certificate-secret
  #   mountPath: /etc/certs
  #   readOnly: true
  #   optional: false

configMaps: []
  # - name: app-config
  #   configMapName: my-app-config
  #   mountPath: /etc/config
  #   readOnly: true
  #   optional: false

# CSI-mounted secrets (Secrets Store CSI driver + Workload Identity): the pod's identity
# fetches the secret from the cloud secret manager and mounts it as a file (never in etcd).
# A container reads it from the mount path, e.g. via an *_FILE env var. Default off (empty).
csiSecrets: []
  # - name: my-secret
  #   mountPath: /var/run/secret/my-secret
  #   secretProviderClass: my-secret-provider
  #   provider: gke
  #   secrets:
  #     - resourceName: "projects/my-project/secrets/my-secret/versions/latest"
  #       path: "my-secret-file"

volume:
  data:
    volumeClaim: ""

# Customize liveness and readiness probe values.
readinessProbe:
  enabled: true

livenessProbe:
  enabled: true
