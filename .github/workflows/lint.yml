name: "Lint Helm Charts"
on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
  pull_request:
    branches:
      - main
    paths:
      - "charts/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    name: "Lint Charts"
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm charts
        run: helm lint charts/*